name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A superseded PR run has no useful result. Keep every main result so each
# merged commit still has a durable CI record.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Turborepo remote cache. Both values are optional: while the secret and the
# repository variable are unset, turbo prints "Remote caching disabled" and
# runs every task locally, exactly as before.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Decides what the rest of the run tests. A pull request only checks the
  # packages its diff affects (turbo follows workspace dependents and the
  # root globalDependencies), so a docs-only PR skips every package job and a
  # web-only PR skips the browser-image package suites. main always runs
  # everything. A skipped job reports success, so required checks still pass.
  changes:
    name: Affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.affected.outputs.all }}
      packages: ${{ steps.affected.outputs.packages }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Resolve affected packages
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            affected=$(./node_modules/.bin/turbo ls --affected --output=json)
          else
            affected=$(./node_modules/.bin/turbo ls --output=json)
          fi
          # Fail loudly rather than select nothing if the output is not the
          # expected JSON (the binary is called directly so pnpm cannot print
          # to stdout first).
          jq -e '.packages.items | type == "array"' <<<"$affected" >/dev/null
          names() { jq -r "[.packages.items[].name | select($1)]" <<<"$affected"; }
          filters() { names "$1" | jq -r 'map("--filter=" + .) | join(" ")'; }
          echo "Affected: $(names true | jq -c .)"
          {
            echo "all=$(filters true)"
            echo "packages=$(filters '. != "@drawstuff/web"')"
            echo "web=$(names '. == "@drawstuff/web"' | jq 'length > 0')"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: changes
    # Runs even when `changes` failed, and then fails itself: otherwise a
    # broken detector would skip every job, and skipped reads as passed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require affected-package detection
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Affected-package detection did not succeed"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check

      - name: Lint
        if: needs.changes.outputs.all != ''
        run: pnpm exec turbo run lint ${{ needs.changes.outputs.all }}

      - name: Typecheck
        if: needs.changes.outputs.all != ''
        run: pnpm exec turbo run typecheck ${{ needs.changes.outputs.all }}

      - name: Check unused production dependencies
        run: pnpm knip

      # A new upstream advisory would otherwise fail every open PR regardless
      # of its diff. Gate on merged commits so main still records the result.
      - name: Audit production dependencies
        if: github.event_name == 'push'
        run: pnpm audit:ci

  test-web:
    name: Unit tests (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      # jsdom only. Running it on its own runner keeps the largest suite off
      # the two cores the package suites share.
      - name: Test
        run: pnpm exec turbo run test --filter=@drawstuff/web

  test-packages:
    name: Unit and browser tests (packages)
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # @drawstuff/collaboration exercises Web Crypto in real Chromium and WebKit.
    # The Playwright image ships both browsers and their system libraries, so
    # there is no `playwright install --with-deps` and no apt-get. Its tag must
    # match the Playwright version pinned in pnpm-workspace.yaml. The job runs
    # as root on purpose: Playwright passes --no-sandbox to Chromium by default,
    # and root keeps every tool cache and home directory writable for pnpm,
    # turbo, and workerd. (The upstream `--user 1001` example exists for
    # Firefox, which refuses to start as root; this suite does not use it.)
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm exec turbo run test ${{ needs.changes.outputs.packages }}

  e2e:
    name: Browser, mobile, and accessibility gates
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # See test-packages for why the browser image is used.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      # `next build` reuses this directory for its incremental compiler cache.
      # The key falls back to the newest cache for the same lockfile when the
      # sources changed, which is still a valid warm start.
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Playwright's webServer runs `pnpm preview`, which builds the production
      # app once before starting it. A separate build step would build it twice.
      - name: Browser, mobile, and accessibility gates
        run: pnpm --filter @drawstuff/web test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: excalidraw-playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A superseded PR run has no useful result. Keep every main result so each
# merged commit still has a durable CI record.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Copy environment examples
        run: cp apps/web/.env.example apps/web/.env

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check unused production dependencies
        run: pnpm knip

      - name: Audit production dependencies
        run: pnpm audit:ci

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Copy environment examples
        run: cp apps/web/.env.example apps/web/.env

      # @drawstuff/collaboration exercises Web Crypto in real Chromium and
      # WebKit. Install with that package's Playwright version so future
      # workspace version changes cannot silently select the wrong build.
      - name: Install Playwright browsers
        run: pnpm --filter @drawstuff/collaboration exec playwright install --with-deps chromium webkit

      - name: Test
        run: pnpm test

  e2e:
    name: Browser, mobile, and accessibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Copy environment examples
        run: cp apps/web/.env.example apps/web/.env

      - name: Install Playwright browsers
        run: pnpm --filter @drawstuff/web exec playwright install --with-deps chromium webkit

      # Playwright's webServer runs `pnpm preview`, which builds the production
      # app once before starting it. A separate build step would build it twice.
      - name: Browser, mobile, and accessibility gates
        run: pnpm --filter @drawstuff/web test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: excalidraw-playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright

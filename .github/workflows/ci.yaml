name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      # Copy .env.example files to .env files
      - name: Copy .env.example files
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Before `Test`, not just before the e2e gates: `pnpm test` includes
      # @drawstuff/collaboration's `browser` vitest project, which re-runs the
      # crypto suites in real Chromium and WebKit. Installing after `Test` left
      # that project unable to launch a browser. Kept after the cheap checks so
      # typecheck, format and lint still fail fast without paying for the
      # download. `chromium` brings its headless shell along, and both
      # playwright versions in the workspace (1.62.0 in apps/web, 1.62.1 in
      # packages/collaboration) pin the same browser revisions, so one install
      # serves the vitest browser project and the e2e gates alike.
      - name: Install Playwright browsers
        run: pnpm --filter @drawstuff/web exec playwright install --with-deps chromium webkit

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit:ci

      - name: Check unused production dependencies
        run: pnpm knip

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Browser, mobile, and accessibility gates
        run: pnpm --filter @drawstuff/web test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: excalidraw-playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright

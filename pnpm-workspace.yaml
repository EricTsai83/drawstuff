packages:
  - "apps/*"
  - "packages/*"

enableGlobalVirtualStore: false

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

overrides:
  # UploadThing 7.7.4 pins a vulnerable effect release.
  effect: 3.20.0
  # Security-only transitive overrides; keep each dependency on its current
  # compatible major while applying the advisory fix.
  shell-quote: 1.10.0
  "picomatch@2": 2.3.2
  lodash-es: 4.18.1
  defu: 6.1.7
  "immutable@4": 4.3.9
  "nanoid@<3.3.8": 3.3.16
  "nanoid@>=4.0.0 <5.0.9": 5.1.16
  "@babel/core@7": 7.29.7
  # GHSA-7p8r-x3mc-p8w7. ajv declares `fast-uri: ^3.0.1`, which already permits
  # the patched 3.1.5, but pnpm will not move a transitive dependency within its
  # range without dragging unrelated resolutions along, so the version is forced
  # here instead. Drop this once ajv ships a floor at or above 3.1.5.
  "fast-uri@<3.1.5": 3.1.5

auditConfig:
  ignoreGhsas:
    # Transitive build-time esbuild advisory through drizzle-kit.
    - GHSA-67mh-4wv8-2f99
    # The four "Next.js-pinned production dependencies" entries that used to sit
    # here were dropped on 2026-08-06: next 16.3.0 ships patched pins, so with
    # this whole list removed only GHSA-67mh-4wv8-2f99 still reports. Keeping
    # them would have left four entries silently accepting nothing.

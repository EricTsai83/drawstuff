packages:
  - "apps/*"
  - "packages/*"

enableGlobalVirtualStore: false

# One version string per shared tool/library; workspaces reference these with
# `catalog:` so declarations stay per package (what turbo and pnpm expect) while
# the version cannot drift between packages.
catalog:
  "@cloudflare/vitest-plugin": 1.3.7
  "@types/node": ^24.13.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  # Exact pin: CI runs browser jobs in mcr.microsoft.com/playwright:v<version>-noble,
  # whose bundled browsers must match this version. Bump both together.
  "@playwright/test": 1.62.1
  eslint: ^9.39.5
  eslint-config-next: ^16.2.12
  eslint-plugin-drizzle: ^0.2.3
  fractional-indexing: 3.2.0
  jsdom: ^29.1.1
  playwright: 1.62.1
  react: 19.2.8
  react-dom: 19.2.8
  typescript: ^6.0.3
  vitest: ^4.1.11
  zod: ^4.4.3

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
  workerd: true

overrides:
  # UploadThing 7.7.4 pins a vulnerable effect release.
  effect: 3.20.0
  # Security-only transitive overrides; keep each dependency on its current
  # compatible major while applying the advisory fix.
  shell-quote: 1.11.0
  proxy-addr: 2.0.8
  "undici@7": 7.29.1
  source-map-js: 1.2.2
  "sharp@<0.35.5": 0.35.5
  "fast-uri@3": 3.1.8
  dompurify: 3.4.16
  "picomatch@2": 2.3.2
  lodash-es: 4.18.1
  defu: 6.1.7
  "immutable@4": 4.3.9
  # Excalidraw 0.18.1 pins nanoid 3.3.3; remove this once upstream requires
  # nanoid 3.3.18 or newer.
  "nanoid@<3.3.18": 3.3.18
  "nanoid@>=4.0.0 <5.0.9": 5.1.16
  "@babel/core@7": 7.29.7

auditConfig:
  ignoreGhsas:
    # Transitive build-time esbuild advisory through drizzle-kit.
    - GHSA-67mh-4wv8-2f99
    # braces 3.0.4 is not published yet; reached only at build time through
    # @excalidraw/excalidraw > sass > chokidar. Drop once 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm
    # KaTeX fix is 0.18.2, but mermaid (through Excalidraw's mermaid import)
    # still requires katex ^0.16; requires pre-existing prototype pollution.
    - GHSA-238p-pmpm-9mq7
    # The four "Next.js-pinned production dependencies" entries that used to sit
    # here were dropped on 2026-08-06: next 16.3.0 ships patched pins, so with
    # this whole list removed only GHSA-67mh-4wv8-2f99 still reports. Keeping
    # them would have left four entries silently accepting nothing.

minimumReleaseAgeExclude:
  # Exact versions required by the official Vitest plugin upgrade.
  - "@cloudflare/vitest-plugin@1.3.7"
  - miniflare@5.20261006.0-alpha
  - wrangler@4.148.0
patchedDependencies:
  "@excalidraw/excalidraw@0.18.1": patches/@excalidraw__excalidraw@0.18.1.patch

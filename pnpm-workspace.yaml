packages:
  - "apps/*"
  - "packages/*"

enableGlobalVirtualStore: false

# One version string per shared tool/library; workspaces reference these with
# `catalog:` so declarations stay per package (what turbo and pnpm expect) while
# the version cannot drift between packages.
catalog:
  "@types/node": ^24.13.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  eslint: ^9.39.5
  eslint-config-next: ^16.2.12
  eslint-plugin-drizzle: ^0.2.3
  fractional-indexing: 3.2.0
  jsdom: ^29.1.1
  react: 19.2.8
  react-dom: 19.2.8
  typescript: ^6.0.3
  vitest: ^4.1.10
  zod: ^4.4.3

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
  workerd: true

overrides:
  # UploadThing 7.7.4 pins a vulnerable effect release.
  effect: 3.20.0
  # Security-only transitive overrides; keep each dependency on its current
  # compatible major while applying the advisory fix.
  shell-quote: 1.10.0
  "picomatch@2": 2.3.2
  lodash-es: 4.18.1
  defu: 6.1.7
  "immutable@4": 4.3.9
  # Excalidraw 0.18.1 pins nanoid 3.3.3; remove this once upstream requires
  # nanoid 3.3.18 or newer.
  "nanoid@<3.3.18": 3.3.18
  "nanoid@>=4.0.0 <5.0.9": 5.1.16
  "@babel/core@7": 7.29.7

auditConfig:
  ignoreGhsas:
    # Transitive build-time esbuild advisory through drizzle-kit.
    - GHSA-67mh-4wv8-2f99
    # The four "Next.js-pinned production dependencies" entries that used to sit
    # here were dropped on 2026-08-06: next 16.3.0 ships patched pins, so with
    # this whole list removed only GHSA-67mh-4wv8-2f99 still reports. Keeping
    # them would have left four entries silently accepting nothing.
